<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ProjectAutomata Team</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						display: ['Space Grotesk', 'sans-serif'],
						mono: ['JetBrains Mono', 'monospace'],
					},
					colors: {
						ink: '#0f172a',
						steel: '#e5e7eb',
						mist: '#f8fafc',
						primary: '#2563eb',
						sky: '#dbeafe',
					},
					boxShadow: {
						card: '0 16px 40px rgba(15, 23, 42, 0.1)',
					},
				},
			},
		};
	</script>
	<style>
		#side-panel { transform: translateX(-100%); }
		#side-panel.panel-open { transform: translateX(0); }
	</style>
</head>
<body class="min-h-screen bg-[#e5e5e0] text-black font-display">
	<button
		id="toggle-panel-btn"
		type="button"
		aria-expanded="false"
		aria-controls="side-panel"
		aria-label="Open navigation panel"
		class="fixed top-4 left-4 z-50 inline-flex items-center justify-center w-10 h-10 rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-colors shadow-sm"
	>
		<svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
			<path d="M4 6h16M4 12h16M4 18h16"/>
		</svg>
	</button>

	<aside id="side-panel" class="fixed top-0 left-0 bottom-0 z-40 w-64 sm:w-72 border-r border-slate-300 bg-white shadow-lg transition-transform duration-200 ease-out">
		<div class="px-4 pt-16 pb-4 sm:pt-20 sm:pb-6 flex flex-col gap-2">
			<a href="/" class="block rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-sm sm:text-base font-semibold text-slate-900 hover:bg-white transition-colors">Main Page</a>
			<a href="/document" class="block rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-sm sm:text-base font-semibold text-slate-900 hover:bg-white transition-colors">Document</a>
			<a href="/team" class="block rounded-md border border-slate-300 bg-slate-50 px-3 py-2 text-sm sm:text-base font-semibold text-slate-900 hover:bg-white transition-colors">Team</a>
		</div>
	</aside>

	<main class="max-w-6xl mx-auto px-6 sm:px-8 lg:px-12 py-16 sm:py-20">
		<header class="mb-12 sm:mb-16">
			<h1 class="text-6xl sm:text-7xl lg:text-8xl font-bold leading-none tracking-tight">The Team</h1>
			<p class="mt-5 text-2xl sm:text-3xl font-semibold leading-tight">Meet us<br />People behind this project.</p>
		</header>

		<section class="grid grid-cols-1 md:grid-cols-3 gap-5 sm:gap-6">
			<article>
				<img src="assets/portfolio/Chheng_Rayuth.jpg" alt="Portrait of Chheng Rayuth" class="w-full h-96 sm:h-112 object-cover" />
				<div class="pt-3">
					<h2 class="text-lg sm:text-xl font-bold">Chheng Rayuth</h2>
					<p class="text-sm sm:text-base text-slate-700">Team Member</p>
				</div>
			</article>

			<article>
				<img src="assets/portfolio/vontey.jpg" alt="Portrait of Dim PonhakVontey" class="w-full h-96 sm:h-112 object-cover" />
				<div class="pt-3">
					<h2 class="text-lg sm:text-xl font-bold">Dim PonhakVontey</h2>
					<p class="text-sm sm:text-base text-slate-700">Team Leader</p>
				</div>
			</article>

			<article>
				<img src="assets/portfolio/BaromPheaknith.JPG" alt="Portrait of Neth BaromPhaknith" class="w-full h-96 sm:h-112 object-cover" />
				<div class="pt-3">
					<h2 class="text-lg sm:text-xl font-bold">Neth BaromPhaknith</h2>
					<p class="text-sm sm:text-base text-slate-700">Team Member</p>
				</div>
			</article>
		</section>
	</main>

	<script>
		(() => {
			const sidePanel = document.getElementById('side-panel');
			const togglePanelBtn = document.getElementById('toggle-panel-btn');

			function isPanelOpen() {
				return sidePanel && sidePanel.classList.contains('panel-open');
			}

			function openPanel() {
				if (!sidePanel) return;
				sidePanel.classList.add('panel-open');
				if (togglePanelBtn) togglePanelBtn.setAttribute('aria-expanded', 'true');
			}

			function closePanel() {
				if (!sidePanel) return;
				sidePanel.classList.remove('panel-open');
				if (togglePanelBtn) togglePanelBtn.setAttribute('aria-expanded', 'false');
			}

			if (togglePanelBtn && sidePanel) {
				togglePanelBtn.addEventListener('click', () => {
					if (isPanelOpen()) closePanel();
					else openPanel();
				});

				document.addEventListener('click', e => {
					if (!isPanelOpen()) return;
					const target = e.target;
					if (!(target instanceof Node)) return;
					if (sidePanel.contains(target) || togglePanelBtn.contains(target)) return;
					closePanel();
				});

				document.addEventListener('keydown', e => {
					if (e.key === 'Escape' && isPanelOpen()) closePanel();
				});
			}
		})();
	</script>
</body>
</html>
